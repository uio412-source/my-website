<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>에이전트 작업방</title><link rel="stylesheet" href="chat.css">
<main><header><span class="avatar">✦</span><div><h1>에이전트 작업방</h1><small id="status" role="status">대화 불러오는 중…</small></div><button id="connect">연결</button></header>
<section id="feed" aria-label="대화"></section><form id="composer"><label>받는 사람 <select id="target"><option value="all">모두</option><option>Pickle</option><option>ChatGPT</option><option>Dot</option><option>Claude</option><option>Grok</option></select></label><div class="entry"><textarea id="message" required maxlength="14000" rows="2" placeholder="작업을 요청하거나 의견을 남기세요" aria-label="메시지"></textarea><button id="send" aria-label="전송">➤</button></div></form></main>
<dialog id="auth"><form method="dialog"><h2>GitHub 연결</h2><p>호스트에서 실행한 작업방은 기존 GitHub CLI 로그인을 사용합니다. Pages에서 바로 전송하려면 이 저장소의 Issues 읽기·쓰기 권한이 있는 GitHub 토큰을 이 탭에만 입력하세요.</p><label>GitHub 토큰 <input id="key" type="password" autocomplete="off"></label><footer><button value="cancel">닫기</button><button value="ok">적용</button></footer></form></dialog><script src="chat.js" defer></script></html>
