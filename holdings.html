<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11151c" media="(prefers-color-scheme: dark)">
  <title>관심종목 | Mr. Stocks</title>
  <meta name="description" content="관심종목 시세, 전일 대비 등락률, 줍줍LV와 종목별 뉴스.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mr. Stocks">
  <meta property="og:title" content="관심종목 | Mr. Stocks">
  <meta property="og:description" content="관심종목 시세, 전일 대비 등락률, 줍줍LV와 종목별 뉴스.">
  <meta property="og:image" content="https://uio412-source.github.io/my-website/assets/img/og-stocks.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://uio412-source.github.io/my-website/holdings.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/portfolio.css">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="ungjup.html">Mr. <span>Stocks</span></a>
      <div class="head-right">
      <nav class="nav" aria-label="메인 메뉴">
        <ul>
          <li><a href="ungjup.html">차트</a></li>
          <li><a href="holdings.html" aria-current="page">관심종목</a></li>
          <li><a href="dividend.html">배당</a></li>
        </ul>
      </nav>
        <button class="theme-btn" id="theme-btn" type="button" aria-label="다크 모드 전환" title="다크/라이트 모드">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page wl">
    <div class="container">
      <div class="wl-head">
        <div>
          <h1>관심종목</h1>
          <p class="wl-sub" id="wl-sub">불러오는 중…</p>
        </div>
        <button class="wl-add" id="add-btn" type="button" aria-label="종목 추가">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>추가</span>
        </button>
      </div>

      <div class="wl-breadth" id="wl-breadth" hidden></div>

      <div class="wl-layout">
        <section class="wl-main" aria-label="관심종목 목록">
          <div class="wl-controls">
            <div class="wl-tabs" id="wl-tabs" role="tablist" aria-label="보기">
              <button type="button" role="tab" data-filter="all" aria-selected="true">전체</button>
              <button type="button" role="tab" data-filter="kr" aria-selected="false">국내</button>
              <button type="button" role="tab" data-filter="us" aria-selected="false">해외</button>
              <button type="button" role="tab" data-filter="deep" aria-selected="false">줍줍권</button>
            </div>
            <label class="wl-sort">
              <span class="sr-only">정렬</span>
              <select id="h-sort">
                <option value="default">기본순</option>
                <option value="change">등락률순</option>
                <option value="lv">줍줍LV순</option>
              </select>
            </label>
          </div>
          <div class="wl-list" id="h-list"><p class="wl-empty" role="status">관심종목을 불러오는 중…</p></div>
        </section>

        <aside class="wl-news" aria-labelledby="news-title">
          <div class="wl-sec-head">
            <h2 id="news-title">관심종목 뉴스</h2>
            <span>최근 7일</span>
          </div>
          <div class="news-rail" id="news-rail"></div>
        </aside>
      </div>
      <p id="watch-status" class="sr-only" role="status"></p>
    </div>
  </main>

  <dialog class="sheet" id="add-dlg" aria-labelledby="add-title">
    <div class="sheet-head">
      <h2 id="add-title">종목 추가</h2>
      <button class="sheet-x" type="button" data-close aria-label="닫기">✕</button>
    </div>
    <div class="sheet-step" id="step-search">
      <input class="sheet-input" id="q" type="search" aria-label="종목명 또는 티커" placeholder="종목명 또는 티커 (예: 삼성전자, NVDA, 애플)" autocomplete="off" enterkeyhint="search">
      <ul class="sym-list" id="sym-list"></ul>
      <p class="sheet-hint" id="sym-hint">미국·한국 상장 종목과 ETF를 찾을 수 있어요.</p>
    </div>
  </dialog>

  <dialog class="sheet detail" id="detail-dlg" aria-labelledby="dt-name">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="detail-body" id="detail-body"></div>
  </dialog>

  <nav class="tabbar" aria-label="메인 메뉴">
    <a href="ungjup.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-6"/></svg><span>차트</span></a>
    <a href="holdings.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg><span>관심종목</span></a>
    <a href="dividend.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg><span>배당</span></a>
  </nav>
  <script src="assets/js/watchlist.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
