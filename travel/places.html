  <header class="site-header">

      <a class="logo" href="./">Mr. <span>Travel</span></a>
      <div class="head-right">
      <nav class="nav" aria-label="메인 메뉴">
        <ul>
          <li><a href="./">혜택</a></li>
          <li><a href="places.html" aria-current="page">여행지</a></li>
          <li><a href="prep.html">여행준비</a></li>
        </ul>
      </nav>
        <button class="theme-btn" id="theme-btn" type="button" aria-label="다크 모드 전환" title="다크/라이트 모드">

      <div class="tv-place-grid">
        <section class="tv-detail" id="tv-detail" aria-live="polite"></section>
        <section class="tv-months" id="tv-months" aria-label="월별 성수기 한눈에"></section>
      </div>
      <p class="tv-foot" id="tv-foot"></p>
    </div>
