            <button data-range="1">1년</button>

            <button data-range="0">전체</button>

        </div>

          <canvas id="uj-overlay"></canvas>
          <div class="uj-tip" id="uj-tip" hidden></div>

            <button type="button" class="cc-sw" id="cc-dip" role="switch" aria-checked="false"><i aria-hidden="true"></i>줍줍구간 배당 재매수</button>
          </div>
          <div class="cc-chart" id="cc-chart">
            <svg id="cc-svg" aria-hidden="true"></svg>
            <div class="uj-tip" id="cc-tip" hidden></div>
          </div>
          <div class="cc-list" id="cc-list"></div>
        </div>
        <div class="ref-card">

          <p class="crash-note" id="cc-note"></p>
        </div>
      </section>

        </div>
        <div class="ref-card">

            </div>
          </div>
          <div class="crash" id="crash"></div>
          <p class="crash-note" id="crash-note"></p>
