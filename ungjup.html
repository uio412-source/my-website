<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11151c" media="(prefers-color-scheme: dark)">
  <title>차트 | Mr. Stocks</title>
  <meta name="description" content="지수별 웅줍 구간과 웅줍LV 차트.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/ungjup.css?v=2">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="ungjup.html">Mr. <span>Stocks</span></a>
      <div class="head-right">
      <nav class="nav" aria-label="메인 메뉴">
        <ul>
          <li><a href="ungjup.html" aria-current="page">차트</a></li>
          <li><a href="holdings.html">보유종목</a></li>
          <li><a href="wealth.html">자산</a></li>
        </ul>
      </nav>
        <button class="theme-btn" id="theme-btn" type="button" aria-label="다크 모드 전환" title="다크/라이트 모드">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <div class="uj-carousel-wrap">
        <div class="uj-carousel" id="uj-carousel" role="tablist" aria-label="지수"></div>
      </div>

      <div class="uj-panel" id="uj-panel">
        <p class="uj-err" id="uj-error" role="status" hidden>데이터를 불러오지 못했습니다. 새로고침 버튼으로 다시 시도해 주세요.</p>
        <div class="uj-summary" id="uj-summary"></div>
        <p class="uj-quote-note">현재가와 전일 대비는 최근 수집한 일봉 기준입니다.</p>
        <div class="uj-controls">
          <div class="uj-seg" id="uj-range" role="group" aria-label="기간">
            <button data-range="0.5">6개월</button>
            <button data-range="1">1년</button>
            <button data-range="3" class="on">3년</button>
            <button data-range="5">5년</button>
            <button data-range="0">전체</button>
          </div>
        </div>
        <ul class="uj-legend" id="uj-legend"></ul>
        <div class="uj-chart" id="uj-chart">
          <canvas id="uj-canvas"></canvas>
          <canvas id="uj-overlay"></canvas>
          <div class="uj-tip" id="uj-tip" hidden></div>
        </div>
      </div>

      <section class="uj-ref" aria-labelledby="ref-title">
        <h2 id="ref-title" class="ref-h">참고자료</h2>
        <div class="ref-card">
          <div class="ref-title">지수별 웅줍LV 현재 위치</div>
          <div class="ref-spec" id="ref-spec"></div>
        </div>
        <div class="ref-card">
          <div class="ref-title"><span id="ref-asset"></span> · LV 구간별 1년 뒤 성과</div>
          <div class="ref-bands" id="ref-bands"></div>
        </div>
      </section>
    </div>
  </main>

  <nav class="tabbar" aria-label="메인 메뉴">
    <a href="ungjup.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-6"/></svg><span>차트</span></a>
    <a href="holdings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg><span>보유종목</span></a>
    <a href="wealth.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9v9z"/><path d="M12 3a9 9 0 0 1 9 9h-9z"/></svg><span>자산</span></a>
  </nav>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/ungjup.js?v=2"></script>
