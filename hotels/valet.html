<!DOCTYPE html>
<html lang="ko" data-site="hotels">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11151c" media="(prefers-color-scheme: dark)">
  <title>서울 호텔 발레파킹 | Mr. Hotels</title>
  <meta name="description" content="서울 지도에서 카드별 무료 발레파킹 호텔을 찾고, 조건 없이 무료인 곳만 골라 보세요. 전월실적·횟수·영수증 조건까지 비교합니다.">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/portfolio.css">
  <link rel="stylesheet" href="../assets/css/hotels.css">
  <link rel="stylesheet" href="../assets/css/hotel-valet.css">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-page="valet">
  <header class="site-header">
    <div class="container">
      <a class="logo" href="./">Mr. <span>Hotels</span></a>
      <div class="head-right">
      <nav class="nav" aria-label="메인 메뉴">
        <ul>
          <li><a href="./">호텔</a></li>
          <li><a href="events.html">이벤트</a></li>
          <li><a href="valet.html" aria-current="page">발레파킹</a></li>
        </ul>
      </nav>
        <button class="theme-btn" id="theme-btn" type="button" aria-label="다크 모드 전환" title="다크/라이트 모드">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page hx hv">
    <div class="container">
      <div class="wl-head">
        <div>
          <h1>발레파킹</h1>
          <p class="wl-sub" id="hv-sub">서울 호텔 · 카드 무료 발레파킹</p>
        </div>
      </div>

      <section class="hv-step" aria-labelledby="hv-pick-h">
        <div class="hv-step-h"><span class="hv-n" aria-hidden="true">1</span><h2 id="hv-pick-h">가진 카드를 골라 주세요</h2><span class="hv-step-c" id="hv-pick-c"></span></div>
        <div class="hv-pickbar">
          <div class="hv-iss" id="hv-iss" role="tablist" aria-label="카드사"></div>
          <label class="hv-q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="hv-cq" placeholder="카드 이름 (예: CLASSIC, 아멕스)" autocomplete="off" aria-label="카드 검색"></label>
        </div>
        <div class="hv-cards" id="hv-cards"><p class="wl-empty" role="status">불러오는 중…</p></div>
        <p class="hv-pend" id="hv-pend"></p>
      </section>

      <section class="hv-step" id="hv-mine-box" aria-labelledby="hv-mine-h" hidden>
        <div class="hv-step-h"><span class="hv-n" aria-hidden="true">2</span><h2 id="hv-mine-h">지난달 실적 채웠나요?</h2></div>
        <ul class="hv-mine" id="hv-mine"></ul>
      </section>

      <section class="hv-step hv-result" aria-labelledby="hv-res-h">
        <div class="hv-step-h"><span class="hv-n" aria-hidden="true" id="hv-res-n">2</span><h2 id="hv-res-h">무료 발레 되는 호텔</h2></div>
        <div class="hv-summary" id="hv-summary"></div>
        <div class="hv-switches" id="hv-switches" hidden>
          <label class="hv-sw"><input type="checkbox" role="switch" id="hv-clean"><span>조건 없이 무료만</span><i aria-hidden="true"></i></label>
          <label class="hv-sw" id="hv-only-box"><input type="checkbox" role="switch" id="hv-only" checked><span>되는 곳만</span><i aria-hidden="true"></i></label>
        </div>
        <div class="hm-map hv-map" id="hv-map" hidden>
          <svg class="hm-svg" id="hv-svg" role="img" aria-label="서울 호텔 발레파킹 지도"></svg>
          <div class="hv-marks" id="hv-marks"></div>
          <button class="hm-up" id="hv-up" type="button" aria-label="서울 전체 보기" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
          </button>
          <p class="hm-legend hv-legend" id="hv-legend"></p>
          <div class="hv-pop" id="hv-pop" role="status" hidden></div>
        </div>
        <div class="hv-filter">
          <div class="hv-gus" id="hv-gus" aria-label="구"></div>
          <label class="hv-q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="hv-q" placeholder="호텔 검색" autocomplete="off" aria-label="호텔 검색"></label>
        </div>
        <div class="wl-rows hv-hotels" id="hv-hotels"><p class="wl-empty" role="status">불러오는 중…</p></div>
      </section>
      <p class="hv-note" id="hv-note"></p>
      <noscript>발레파킹 정보를 보려면 자바스크립트를 켜 주세요.</noscript>
    </div>
  </main>

  <nav class="tabbar" aria-label="메인 메뉴">
    <a href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M10 21v-4h4v4"/></svg><span>호텔</span></a>
    <a href="events.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg><span>이벤트</span></a>
    <a href="valet.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.8-8 10-8 10s-8-5.2-8-10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><span>발레파킹</span></a>
  </nav>
  <script src="../assets/js/main.js"></script>
  <script type="module" src="../assets/js/hotel-valet.js"></script>
</body>
</html>
