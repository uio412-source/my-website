<!DOCTYPE html>
<html lang="ko" data-site="hotels">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11151c" media="(prefers-color-scheme: dark)">
  <title>서울 호텔 혜택 | Mr. Hotels</title>
  <meta name="description" content="서울 호텔의 조식, 라운지, 객실 업그레이드 혜택을 멤버십 등급별로 비교하세요.">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/hotels.css">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <script defer src="../assets/js/main.js"></script>
  <script defer src="../assets/js/hotels.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="./">Mr. <span>Hotels</span></a>
      <div class="head-right">
        <button class="theme-btn" id="theme-btn" type="button" aria-label="다크 모드로 전환">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main class="container hotel-page">
    <h1>서울 호텔 혜택</h1>
    <nav id="hotel-programs" class="hotel-programs" aria-label="호텔 프로그램">
      <a href="#accor">Accor</a>
      <a href="#ihg">IHG</a>
      <a href="#hotelux">HOTELLUX</a>
      <a href="#marriott">Marriott</a>
      <a href="#hilton">Hilton</a>
    </nav>
    <div id="hotel-directory" hidden>
      <div class="hotel-filters">
        <label>국가<select id="hotel-country"></select></label>
        <label>도시<select id="hotel-city"></select></label>
        <label>구<select id="hotel-district"></select></label>
        <label id="hotel-tier-field">등급<select id="hotel-tier"></select></label>
        <label class="hotel-search">호텔 검색<input type="search" id="hotel-query" placeholder="호텔명 또는 구"></label>
      </div>
      <div class="hotel-list-heading">
        <p id="hotel-count" role="status" aria-live="polite"></p>
        <a id="hotel-terms" href="">공식 혜택</a>
      </div>
      <div class="hotel-table-wrap">
        <table class="hotel-table" aria-label="호텔별 혜택">
          <colgroup><col class="district-col"><col class="hotel-col"><col class="star-col"><col></colgroup>
          <thead><tr><th scope="col">구</th><th scope="col">호텔명</th><th scope="col">성급</th><th scope="col" id="hotel-benefit-heading">티어 혜택</th></tr></thead>
          <tbody id="hotel-list"></tbody>
        </table>
        <p id="hotel-empty" hidden>검색 조건에 맞는 호텔이 없습니다.</p>
      </div>
      <details class="hotel-notes">
        <summary>혜택 조건 및 출처</summary>
        <p id="hotel-conditions"></p>
        <p id="hotel-checked"></p>
        <ul id="hotel-sources"></ul>
      </details>
    </div>
    <p id="hotel-status" role="status">호텔 목록을 불러오는 중…</p>
    <noscript>호텔 목록을 보려면 자바스크립트를 켜 주세요.</noscript>
  </main>
</body>
</html>
