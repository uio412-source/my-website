<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>명언 배너 미리보기(임시)</title>
<style>
  body { margin: 0; padding: 12px; font: 13px/1.4 system-ui, sans-serif; background: #dfe3ea; }
  .row { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 12px; }
  .box { background: #fff; border-radius: 8px; overflow: hidden; }
  .label { font-weight: 700; margin: 0 0 4px; }
  iframe { border: 0; display: block; }
</style>
</head>
<body>
  <div class="row">
    <div><p class="label">390px (라이트)</p><div class="box"><iframe src="ungjup.html" width="390" height="300"></iframe></div></div>
    <div><p class="label">360px (라이트)</p><div class="box"><iframe src="ungjup.html" width="360" height="300"></iframe></div></div>
    <div><p class="label">768px (라이트)</p><div class="box"><iframe src="ungjup.html" width="768" height="300"></iframe></div></div>
  </div>
  <div class="row">
    <div><p class="label">390px (다크)</p><div class="box"><iframe id="d390" src="ungjup.html" width="390" height="300"></iframe></div></div>
    <div><p class="label">360px (다크)</p><div class="box"><iframe id="d360" src="ungjup.html" width="360" height="300"></iframe></div></div>
  </div>
<script>
  ['d390', 'd360'].forEach(function (id) {
    var f = document.getElementById(id);
    f.addEventListener('load', function () {
      try {
        f.contentDocument.documentElement.setAttribute('data-theme', 'dark');
        f.contentDocument.documentElement.style.background = '#11151c';
      } catch (e) { document.title = 'err ' + e.message; }
    });
  });
  var keep = setInterval(function () {
    ['d390', 'd360'].forEach(function (id) {
      var f = document.getElementById(id);
      try { f.contentDocument.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
    });
  }, 500);
  setTimeout(function () { clearInterval(keep); }, 20000);
</script>
</body>
</html>
