<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11151c" media="(prefers-color-scheme: dark)">
  <title>배당 | Mr. Stocks</title>
  <meta name="description" content="보유 종목의 예상 배당금과 배당률.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/portfolio.css">
  <link rel="stylesheet" href="assets/css/dividend.css">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="ungjup.html">Mr. <span>Stocks</span></a>
      <div class="head-right">
      <nav class="nav" aria-label="메인 메뉴">
        <ul>
          <li><a href="ungjup.html">차트</a></li>
          <li><a href="holdings.html">관심종목</a></li>
          <li><a href="dividend.html" aria-current="page">배당</a></li>
        </ul>
      </nav>
        <button class="theme-btn" id="theme-btn" type="button" aria-label="다크 모드 전환" title="다크/라이트 모드">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page dv">
    <div class="container">
      <div class="wl-head">
        <div>
          <h1>배당</h1>
          <p class="wl-sub" id="dv-sub">불러오는 중…</p>
        </div>
        <button class="wl-add" id="dv-add" type="button" aria-label="보유 종목 추가">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>종목 추가</span>
        </button>
      </div>

      <section class="dv-hero" aria-label="배당 요약">
        <div class="dv-hero-top">
          <span>예상 연간 배당</span>
          <div class="dv-tax" id="dv-tax" role="group" aria-label="세금 기준">
            <button type="button" data-tax="0" aria-pressed="true">세전</button>
            <button type="button" data-tax="1" aria-pressed="false">세후</button>
          </div>
        </div>
        <div class="dv-kpis">
          <div class="dv-kpi"><span>투자금</span><b id="k-invest">0원</b><small id="k-count">0종목</small></div>
          <div class="dv-kpi"><span>연 배당금</span><b id="k-div">0원</b><small id="k-month">월 평균 0원</small></div>
          <div class="dv-kpi accent"><span>배당률</span><b id="k-yield">0.00%</b><small id="k-cur">현재가 기준 0.00%</small></div>
        </div>
      </section>

      <section class="dv-cal" id="dv-cal" aria-labelledby="cal-title" hidden>
        <div class="wl-sec-head"><h2 id="cal-title">월별 예상 배당금</h2><span>배당락 월 기준</span></div>
        <div class="cal-bars" id="cal-bars"></div>
      </section>

      <section class="dv-list-sec" aria-labelledby="list-title">
        <div class="wl-sec-head"><h2 id="list-title">보유 종목</h2><span id="dv-count"></span></div>
        <div id="dv-list"><p class="wl-empty" role="status">불러오는 중…</p></div>
      </section>

      <section class="ft" id="ft" aria-labelledby="ft-title" hidden>
        <div class="wl-sec-head"><h2 id="ft-title">금융소득종합과세 한도</h2><span>2026년 지급분 · 국내 세법 기준</span></div>
        <div class="ft-card">
          <div class="ft-top">
            <div><span class="ft-k">2,000만원 판정에 들어가는 금융소득</span><b class="ft-big" id="ft-total">0원</b></div>
            <div class="ft-left" id="ft-left"></div>
          </div>
          <div class="ft-bar" id="ft-bar"><i></i></div>
          <div class="ft-scale" aria-hidden="true"><span>0</span><span>1,000만</span><span>2,000만원</span></div>
          <ul class="ft-rows" id="ft-rows"></ul>
        </div>
        <div class="ft-card">
          <div class="ft-inputs">
            <label class="fld"><span>예금·채권 이자 (연, 만원)</span><input id="ft-interest" class="sheet-input" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
            <label class="fld"><span>국내상장 해외·기타 ETF 매도 차익 (올해, 만원)</span><input id="ft-gain" class="sheet-input" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
            <label class="fld"><span>다른 종합소득 과세표준 (근로·사업, 만원)</span><input id="ft-other" class="sheet-input" type="number" inputmode="decimal" min="0" step="any" placeholder="연말정산 영수증의 과세표준"></label>
          </div>
          <div class="ft-tax" id="ft-tax"></div>
        </div>
        <details class="ft-card ft-detail" id="ft-detail">
          <summary>종목별로 어떻게 잡혔는지 <small>분류·계좌·과세 비중을 바꿀 수 있어요</small></summary>
          <div id="ft-items"></div>
        </details>
        <ul class="ft-notes" id="ft-notes"></ul>
      </section>

      <p class="dv-note" id="dv-note"></p>
      <p id="dv-status" class="sr-only" role="status"></p>
    </div>
  </main>

  <dialog class="sheet" id="dv-dlg" aria-labelledby="dv-title">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="dv-title">보유 종목 추가</h2>
      <button class="sheet-x" type="button" data-close aria-label="닫기">✕</button>
    </div>
    <form class="sheet-step" id="dv-form" novalidate>
      <div class="combo">
        <label class="fld" for="dv-q"><span>종목</span></label>
        <input id="dv-q" class="sheet-input" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false"
               aria-controls="dv-opts" placeholder="종목명 또는 티커 (예: 삼성전자, SCHD)" autocomplete="off" enterkeyhint="search">
        <ul class="combo-list" id="dv-opts" role="listbox" aria-label="검색 결과" hidden></ul>
      </div>
      <div class="dv-picked" id="dv-picked" hidden></div>
      <div class="fld-row">
        <label class="fld"><span>수량 (주)</span><input id="dv-qty" class="sheet-input" type="number" inputmode="decimal" min="0" step="any"></label>
        <label class="fld"><span id="dv-cost-label">취득가 (주당)</span><input id="dv-cost" class="sheet-input" type="number" inputmode="decimal" min="0" step="any" placeholder="비우면 현재가"></label>
      </div>
      <label class="fld" id="dv-dps-wrap" hidden><span id="dv-dps-label">연간 주당 배당금 (직접 입력)</span><input id="dv-dps" class="sheet-input" type="number" inputmode="decimal" min="0" step="any"></label>
      <div class="dv-preview" id="dv-preview" hidden></div>
      <p class="dv-err" id="dv-err" role="alert"></p>
      <div class="sheet-btns">
        <button type="button" class="btn-danger" id="dv-del" hidden>삭제</button>
        <button type="submit" class="btn-primary" id="dv-save">저장</button>
      </div>
    </form>
  </dialog>

  <nav class="tabbar" aria-label="메인 메뉴">
    <a href="ungjup.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-6"/></svg><span>차트</span></a>
    <a href="holdings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg><span>관심종목</span></a>
    <a href="dividend.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg><span>배당</span></a>
  </nav>
  <script src="assets/js/dividend.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
