# 수집 PR(ai/chatgpt/data-*) 자동 머지 → 배포. 조건·동작은 tools/data/automerge.py 맨 위 설명.
# pull_request_target이라 이 파일과 스크립트는 항상 main 것이 실행되고, PR에서는 data/inbox JSON만 가져와 검사합니다.
name: 수집 PR 자동 머지

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  schedule:
    - cron: "23 */3 * * *"   # 3시간마다 놓친 PR 다시 확인
  workflow_dispatch:

permissions:
  contents: write        # 머지
  pull-requests: write   # 실패 이유 댓글
  issues: write
  actions: write         # 배포 워크플로 실행

concurrency:
  # PR 이벤트는 PR마다 하나만: 대기 중에 새 커밋이 오면 이전 실행을 취소하고 다시 기다림
  group: data-automerge-${{ github.event.pull_request.number || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  automerge:
    if: github.event_name != 'pull_request_target' || startsWith(github.head_ref, 'ai/chatgpt/data-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집기가 커밋을 다 올릴 때까지 10분 대기
        if: github.event_name == 'pull_request_target'
        run: sleep 600
      - name: 검사 후 머지
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python tools/data/automerge.py ${PR:+--pr "$PR"}
