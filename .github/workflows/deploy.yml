# main 브랜치에 변경이 들어오면 GitHub Pages로 자동 배포합니다.
# 매일 정해진 시각에도 실행해서 줍줍 지표 데이터를 최신으로 갱신한 뒤 배포합니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "40 21 * * *"   # 매일 한국시간 06:40 (미국장 마감 후)
    - cron: "40 7 * * *"    # 매일 한국시간 16:40 (한국장 마감 후)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 줍줍 지표 데이터 갱신
        # 실패해도 저장소에 들어 있는 데이터로 배포를 계속합니다.
        continue-on-error: true
        run: |
          pip install --quiet numpy pandas
          python tools/ungjup/build.py
      - name: 배포 버전 표시 (오래된 페이지 자동 새로고침용)
        run: python tools/stamp_version.py "${GITHUB_SHA::7}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: paymorevent/package-lock.json
      - name: 페이모먼트 정적 사이트 빌드
        working-directory: paymorevent
        run: |
          npm ci
          npm run build
      - name: GitHub Pages 배포 파일 준비
        run: |
          pages="$RUNNER_TEMP/pages"
          mkdir -p "$pages/paymorevent"
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/paymorevent/' ./ "$pages/"
          cp -a paymorevent/dist/. "$pages/paymorevent/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages
      - id: deployment
        uses: actions/deploy-pages@v4
